<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tradovate Dashboard</title>

<style>
body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}
.header{
    background:#1d1d1d;
    padding:18px;
    font-size:28px;
    font-weight:bold;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    padding:20px;
}
.card{
    background:#222;
    border-radius:10px;
    padding:18px;
    box-shadow:0 0 10px rgba(0,0,0,.35);
}
.label{
    color:#888;
    font-size:14px;
}
.value{
    font-size:36px;
    margin-top:8px;
}
.footer{
    padding:20px;
    color:#888;
}
.online{
    color:#55ff55;
}
</style>

</head>

<body>

<div class="header">
Tradovate Auto Trader
<span class="online" id="status">● ONLINE</span>
</div>

<div class="grid">

<div class="card">
<div class="label">Signals Today</div>
<div class="value" id="signals">-</div>
</div>

<div class="card">
<div class="label">Accepted</div>
<div class="value" id="accepted">-</div>
</div>

<div class="card">
<div class="label">Acceptance Rate</div>
<div class="value" id="rate">-</div>
</div>

<div class="card">
<div class="label">Orders</div>
<div class="value" id="orders">-</div>
</div>

<div class="card">
<div class="label">Open Positions</div>
<div class="value" id="open">-</div>
</div>

<div class="card">
<div class="label">Closed Today</div>
<div class="value" id="closed">-</div>
</div>

</div>

<div class="footer">
Last Refresh:
<span id="refresh">never</span>
</div>

<script>

async function refresh(){

    const r=await fetch('/analytics');
    const j=await r.json();

    document.getElementById('signals').innerText=j.today.signals;
    document.getElementById('accepted').innerText=j.today.accepted;
    document.getElementById('rate').innerText=j.acceptanceRate+"%";
    document.getElementById('orders').innerText=j.orders;
    document.getElementById('open').innerText=j.today.opened-j.today.closed;
    document.getElementById('closed').innerText=j.today.closed;

    document.getElementById('refresh').innerText=
        new Date().toLocaleTimeString();

}

refresh();
setInterval(refresh,5000);

</script>

</body>
</html>
